[project]
name = "ai-tools"
version = "0.1.0"
description = "本地 AI 短剧生产线：剧本 → 分镜 → 出图 → 配音 → 字幕 → 预览视频"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-audio",   # 本地配音（Qwen3-TTS，Apple Silicon）
    "soundfile",   # 读取音频时长、合并音频
    "opencv-python-headless",  # 人脸检测/比对（YuNet + SFace）、图片缩放
    "numpy",
    "jsonschema>=4.26,<5",  # 校验模型结构化输出，失败后可云端兜底
    "starlette",   # 网页控制台（studio web）
    "uvicorn",
    "mcp>=2.3.0",
    "httpx>=0.28.1",
]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
