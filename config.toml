# ai-tools 配置。改完直接生效，不用重启。

[comfy]
# ComfyUI 桌面版：设置 → 关于 里能看到端口
url = "http://127.0.0.1:8188"
timeout_sec = 1200         # 单张图最长等待时间
# 文生图用哪套工作流（空镜、定妆照）：t2i_klein（快，~1 分钟）或 t2i_moss（慢，~4 分钟）
t2i_profile = "t2i_klein"

# 换模型时：在 ComfyUI 里 工作流 → 导出(API)，放进 workflows/，再填下面的节点编号
[comfy.t2i_klein]
workflow = "workflows/klein_t2i_api.json"
prompt_node = "75:74"      # CLIPTextEncode
seed_node = "75:73"        # RandomNoise（noise_seed）
save_node = "9"
# 尺寸写在工作流里：768×1344（9:16）

[comfy.t2i_moss]
workflow = "workflows/moss_t2i_api.json"
prompt_node = "18:17"      # Text (User Prompt)
seed_node = "18:7"         # K采样器
save_node = "9"
resolution_node = "19"     # 分辨率选择器
aspect_ratio = "9:16 (Portrait Widescreen)"

# 参考图编辑：有角色的镜头把定妆照喂给模型，照着这张脸画（FLUX.2 klein 4B，bf16）
# 关掉：enabled = false，或者运行时加 --no-edit
[comfy.edit]
enabled = true
workflow = "workflows/klein_edit_api.json"
prompt_node = "75:74"      # 提示词节点（CLIPTextEncode）
seed_node = "75:73"        # 随机噪声节点（RandomNoise，noise_seed）
save_node = "9"            # 保存图像节点
image_node = "76"          # 加载图像节点（LoadImage，参考图）

[tts]
model = "mlx-community/Qwen3-TTS-12Hz-1.7B-CustomVoice-bf16"
lang_code = "chinese"
default_voice = "Vivian"   # 可选：Vivian / Serena / Uncle_Fu / Eric / Dylan

[subtitle]
max_chars = 16             # 每条字幕最多字数（竖屏建议 12~16）

[video]
width = 1080
height = 1920
fps = 30
pad_sec = 0.4              # 每句台词后留白（秒）
silent_shot_sec = 2.0      # 没有台词的镜头默认时长

[qa]
enabled = true             # 出图后自动质检，不合格换 seed 重画
max_attempts = 2           # 每个镜头最多画几次
face = true                # 人脸一致性（和角色定妆照比对）
face_threshold = 0.40      # 第二次校准（klein）：误拒 11%、误收 27%；质检定位为筛掉明显换脸，极端表情人工复核
cast_angles = true         # 定妆照额外生成左右 3/4 侧脸（需要参考图编辑），侧脸镜头和侧脸照比
angle_threshold = 0.35     # 侧脸照和正脸的最低相似度（角度本身会拉低分数，所以比 face_threshold 宽；暂定值）
gallery = true             # 通过质检的镜头加入角色图库，后面的镜头也和它们比
vision = true              # 用 LM Studio 的看图模型检查画面（要先打开 LM Studio Server）
vision_model = "google/gemma-4-e4b"
vision_min_score = 3       # 画面符合度 1~5，低于它算不合格

[lmstudio]
url = "http://127.0.0.1:1234/v1"
# 在 LM Studio 的 Developer 页面看模型名；中文剧本建议换成 Qwen 14B 级别
model = "google/gemma-4-e4b"
ttl_sec = 300              # 模型空闲多少秒后 LM Studio 自动卸载
# 本地推理最长等待时间；小模型拆长剧本较慢，可自行调小以更快进入兜底
timeout_sec = 600

# 可选云端兜底：目前仅本地运行，默认关闭；启用后，本地失败才发送剧本/图片到云端
# 服务需支持 OpenAI Chat Completions、temperature 和严格 json_schema；看图还需支持 image_url
[lmstudio.cloud]
enabled = false
url = ""                  # 供应商的 OpenAI 兼容地址，通常以 /v1 结尾
model = ""                # 云端文本模型 ID（用于拆分镜）
vision_model = ""         # 云端看图模型 ID；留空表示不对图片启用兜底
api_key_env = "STUDIO_CLOUD_API_KEY"  # 密钥放在此环境变量中，不写进配置或仓库
timeout_sec = 120          # 云端请求超时（秒）


# 图生视频：每个镜头的图 → 几秒动态镜头（"动态分镜"，看动作和节奏；定稿镜头再交给可灵 / 即梦）
# 引擎 ltx-2-mlx 装在独立目录、独立 uv 环境，这里用子进程调用
[i2v]
enabled = false            # studio run 默认不跑（加 --i2v 开启），或者单独 studio i2v
engine = "ltx_mlx"
engine_dir = "~/ai-engines/ltx-2-mlx"
model = "dgrauet/ltx-2.3-mlx-q4"
extra_args = ["--distilled", "--low-ram"]   # 蒸馏版（步数少）+ 按块从磁盘加载（24GB 内存需要）
compute_dtype = "float16"  # 实测比默认快约 10%，画面 SSIM 0.95、人脸相似度持平
width = 448                # 宽高要是 32 的倍数；9:16 想更清楚可以试 576×1024（更慢、更吃内存）
height = 768
fps = 24
max_frames = 121           # 每段最长 5 秒（帧数是 8k+1）；镜头比片段长时，预览视频里定格最后一帧补齐
timeout_sec = 1800
face_check = true          # 抽帧和定妆照比人脸，低于 [qa] face_threshold 标 👀
sample_every = 6           # 每几帧抽一帧
max_yaw = 0.35             # 只统计正脸/半侧脸的帧，转头、背影的帧跳过
